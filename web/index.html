<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSearch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="mode-toggle">
            <label class="switch">
                <input type="checkbox" id="toggleMode">
                <span class="slider"></span>
            </label>    
            <span id="modeLabel">Light Mode</span>
        </div>
        

        <h1 class="titre">VSearch</h1>
        <div class="search-container">
            <input class="inp" id="inp" placeholder="Search">
            <button class="btn" id="btn">Search</button>
        </div>
    </main>

    <script type = "module" src = "userAuthen.js"></script>
    <script type = "module" src = "anime.js"></script>
    <script src = "search.js"></script>
    <script src = "result.js"></script>
    <script src = "newResult.js"></script>
</body>
</html
